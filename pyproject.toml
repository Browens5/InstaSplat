[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instasplat"
version = "0.1.0"
description = "Full Mac pipeline: Insta360 360° video → navigable 3D Gaussian splat"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "InstaSplat" }]
keywords = [
  "insta360",
  "insv",
  "gaussian-splatting",
  "colmap",
  "metal",
  "yolo",
  "splat-transform",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "typer>=0.12",
  "tqdm>=4.66",
  "ultralytics>=8.2",
  "torch>=2.2",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Optional: maturin develop -m native/instasplat_densify/Cargo.toml
densify_native = ["maturin>=1.5"]

[project.scripts]
instasplat = "instasplat.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["instasplat"]

# Ship Metal shader sources with the wheel
[tool.hatch.build.targets.wheel.force-include]
"instasplat/metal_equirect/metal" = "instasplat/metal_equirect/metal"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]  # Typer Option defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"instasplat/gui/app.py" = ["I001"]
